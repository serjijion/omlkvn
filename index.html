<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОМЛ КВН г.Заринска - Продажа билетов</title>
<style>
body {
font-family: system-ui, -apple-system, sans-serif;
background: #0a0516 url('bg.png') no-repeat center center fixed;
background-size: cover;
display: flex;
align-items: center;
justify-content: center;
min-height: 100vh;
margin: 0;
padding: 25px;
color: #f3f4f6;
overflow-x: hidden;
position: relative;
}
.large-glare {
position: fixed;
right: -15%;
top: 50%;
transform: translateY(-50%);
width: 65vw;
height: 65vw;
max-width: 900px;
max-height: 900px;
background: url('logo_white.png') no-repeat center center;
background-size: contain;
opacity: 0.12;
mix-blend-mode: screen;
pointer-events: none;
z-index: 1;
}
.floating-logo {
position: fixed;
background: url('logo_metal.png') no-repeat center center;
background-size: contain;
pointer-events: none;
z-index: 2;
animation: floatRotation 12s infinite ease-in-out;
}
.layer-deep { width: 100px; height: 100px; opacity: 0.2; filter: blur(4px); animation-duration: 18s; }
.layer-mid { width: 160px; height: 160px; opacity: 0.4; filter: blur(1px); animation-duration: 14s; }
.layer-front { width: 220px; height: 220px; opacity: 0.6; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.7)); animation-duration: 10s; }

@keyframes floatRotation {
0% { transform: translateY(0) rotate(0deg); }
50% { transform: translateY(-15px) rotate(8deg); }
100% { transform: translateY(0) rotate(0deg); }
}
.card {
background: rgba(20, 10, 35, 0.65);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid rgba(255, 255, 255, 0.08);
border-radius: 24px;
box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
padding: 35px;
width: 100%;
max-width: 1050px;
text-align: center;
position: relative;
z-index: 10;
}
.info-title {
margin: 10px 0 25px 0;
font-size: clamp(22px, 4vw, 36px);
font-weight: 800;
line-height: 1.3;
text-transform: uppercase;
background: linear-gradient(135deg, #fff 0%, #a78bfa 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
letter-spacing: -0.5px;
}
.info-block {
background: rgba(255, 255, 255, 0.01);
border: 1px solid rgba(255, 255, 255, 0.04);
border-radius: 20px;
padding: 30px;
margin-top: 20px;
text-align: center;
}
.distributor-card {
background: rgba(139, 92, 246, 0.04);
border: 1px solid rgba(139, 92, 246, 0.15);
border-radius: 16px;
padding: 30px;
max-width: 600px;
margin: 20px auto 0 auto;
display: flex;
flex-direction: column;
gap: 16px;
align-items: center;
}
.action-btn {
width: 100%;
max-width: 380px;
box-sizing: border-box;
background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
color: white;
border: none;
padding: 16px 24px;
border-radius: 12px;
cursor: pointer;
font-size: 18px;
font-weight: bold;
text-decoration: none;
text-align: center;
box-shadow: 0 4px 15px rgba(109, 40, 217, 0.3);
transition: all 0.2s;
display: inline-flex;
align-items: center;
justify-content: center;
gap: 10px;
}
.action-btn:hover {
transform: translateY(-2px);
box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
}
.action-btn:active {
transform: translateY(0);
}
.toast {
position: fixed;
bottom: 30px;
left: 50%;
transform: translateX(-50%) translateY(100px);
background: rgba(16, 185, 129, 0.95);
border: 1px solid #10b981;
color: white;
padding: 12px 24px;
border-radius: 10px;
font-size: 14px;
font-weight: 600;
box-shadow: 0 10px 25px rgba(0,0,0,0.3);
transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
z-index: 100;
pointer-events: none;
}
.toast.show {
transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>
<div class="large-glare"></div>
<div class="floating-logo layer-deep" style="top: 15%; left: 8%;"></div>
<div class="floating-logo layer-mid" style="top: 65%; left: 4%;"></div>
<div class="floating-logo layer-front" style="top: 40%; left: -5%;"></div>
<div class="floating-logo layer-deep" style="top: 75%; right: 5%;"></div>
<div class="floating-logo layer-mid" style="top: 10%; right: 10%;"></div>
<div class="floating-logo layer-front" style="top: 50%; right: -6%; animation-delay: -3s;"></div>

<div class="card">
<!-- СЕКЦИЯ С АФИШЕЙ И КУАР-КОДОМ -->
<div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 50px; margin-bottom: 40px; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255,255,255,0.04); border-radius: 20px; padding: 35px;">
<!-- Блок Афиши -->
<div style="flex: 1; min-width: 300px; max-width: 380px; text-align: center;">
<img src="poster.jpg" alt="Афиша КВН" style="width: 100%; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);">
</div>
<!-- Блок Информации -->
<div style="flex: 1; min-width: 280px; max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 25px;">
<a href="https://taplink.cc" target="_blank" style="text-decoration: none; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">
<h3 style="margin: 0; font-size: 20px; color: #fff; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; background: linear-gradient(135deg, #fff 0%, #a78bfa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer;">
Наши соц.сети
</h3>
</a>
<a href="https://taplink.cc" target="_blank" style="text-decoration: none; display: block; transition: transform 0.2s, box-shadow 0.2s;" onmouseover="this.style.transform='translateY(-3px)'; this.style.boxShadow='0 5px 25px rgba(139,92,246,0.4)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 0 20px rgba(139,92,246,0.3)'">
<div style="background: #110a26; border: 2px solid #8b5cf6; padding: 15px; border-radius: 20px; width: 190px; height: 190px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; cursor: pointer;">
<img src="qr_social.png" alt="QR-код" style="width: 100%; height: 100%; object-fit: contain;">
</div>
</a>
<div style="width: 190px; height: 190px; overflow: hidden; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
<img src="league_logo.png" alt="Логотип Лиги КВН" style="width: 100%; height: 100%; object-fit: contain; border-radius: 16px;">
</div>
</div>
</div>
<!-- КОНЕЦ СЕКЦИИ -->

<div style="margin-bottom: 35px; text-align: center;">
<h1 style="margin: 0; font-size: clamp(36px, 6vw, 68px); font-weight: 900; line-height: 0.9; text-transform: uppercase; background: linear-gradient(135deg, #fff 30%, #a78bfa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px;">
Онлайн-бронирование временно закрыто
</h1>
</div>

<!-- ИНФОРМАЦИОННЫЙ БЛОК ВЗАМЕН СХЕМЫ И ИНСТРУКЦИЙ -->
<div class="info-block">
<h2 class="info-title">Билеты можно приобрести в ГДК "Строитель" или у распространителей:</h2>

<div class="distributor-card">
<div style="font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 4px;">
Тамара Геннадьевна Смирнова
</div>
<div style="font-size: 14px; color: #a78bfa; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;">
Билеты 24/7
</div>
<a href="https://vk.ru" target="_blank" class="action-btn">
Написать в ВК
</a>
<button onclick="copyPhoneNumber('89236559866')" class="action-btn" title="Нажмите, чтобы скопировать">
8 (923) 655-98-66
</button>
</div>
</div>
</div>

<!-- Всплывающее уведомление о копировании -->
<div id="toast" class="toast">Номер скопирован в буфер обмена!</div>

<script>
// Легкий параллакс эмблем при движении мыши
document.addEventListener('mousemove', (e) => {
const amount = 20;
const x = (e.clientX / window.innerWidth - 0.5) * amount;
const y = (e.clientY / window.innerHeight - 0.5) * amount;
document.querySelectorAll('.layer-front').forEach(el => {
el.style.transform = `translate(${x}px, ${y - 15}px) rotate(8deg)`;
});
document.querySelectorAll('.layer-mid').forEach(el => {
el.style.transform = `translate(${x * 0.5}px, ${y * 0.5 - 15}px) rotate(8deg)`;
});
});

// Функция для копирования номера телефона
function copyPhoneNumber(phoneNumber) {
navigator.clipboard.writeText(phoneNumber).then(() => {
const toast = document.getElementById('toast');
toast.classList.add('show');
setTimeout(() => {
toast.classList.remove('show');
}, 2500);
}).catch(err => {
console.error('Не удалось скопировать текст: ', err);
});
}
</script>
</body>
</html>
